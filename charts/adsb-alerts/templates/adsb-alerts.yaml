apiVersion: apps/v1
kind: Deployment
metadata:
  name: adsb-alerts-deployment
  labels:
    app.kubernetes.io/name: adsb-alerts
    app.kubernetes.io/component: alerts
spec:
  replicas: 1 
  selector:
    matchLabels:
      app.kubernetes.io/name: adsb-alerts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adsb-alerts
    spec:
      containers:
        - name: adsb-alerts
          image: adsb-alerts:local
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["adsb-alerts/main.py"]
          env:
            - name: DB_DSN
              valueFrom: 
                secretKeyRef:
                  name: adsb-db-credentials
                  key: database_dsn
            - name: DISCORD_WEBHOOK
              valueFrom: 
                secretKeyRef:
                  name: adsb-alerts-secret
                  key: discord_webhhok_adsb_alerts
            - name: SLEEP_INTERVAL
              value: "60"
            - name: DB_INTERVAL
              value: "90"
            - name: LOG_LEVEL
              value: DEBUG
            - name: FILTER_PATH
              value: /app/adsb-alerts/filters.json
            - name: ALERT_PARAMS
              value: "hex, flight, lat, lon, alt_baro, squawk, description"
            - name: MAX_DISCORD_RETRIES
              value: "3"
            - name: TRACKING_URL
              value: "https://globe.adsbexchange.com/?icao="
            - name: TRACKING_DIR
              value: /app/adsb-alerts/tracking
          # Resource limits 
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            # Mount the alerts filters JSON from the secret
            - name: adsb-alerts-secret
              mountPath: /app/adsb-alerts/filters.json
              subPath: alerts_filters.json
              readOnly: true
            # Mounted as a dir without subPath so secret updates reach the pod without a restart
            - name: adsb-alerts-tracking
              mountPath: /app/adsb-alerts/tracking
              readOnly: true
      volumes:
        # This volume now references the secret created by the ExternalSecret
        - name: adsb-alerts-secret
          secret:
            secretName: adsb-alerts-secret
        - name: adsb-alerts-tracking
          secret:
            secretName: adsb-alerts-tracking
            # The pod still starts if no tracking lists exist yet
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: adsb-alerts-service
spec:
  selector:
    app.kubernetes.io/name: adsb-alerts
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
