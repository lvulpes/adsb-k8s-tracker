# charts/adsb-db/values.yaml
# Pin the exact image (PostgreSQL 18.6) so a new major version in bitnami's :latest
# can't break the data directory. The digest overrides the chart's tag.
image:
  digest: "sha256:5614f19e4a5077217e53b3bd7e7f69d06af6a02919af4b90a9702e3648190c8c"
auth:
  enabled: true
  existingSecret: "adsb-db-credentials"
  secretKeys:
    adminPasswordKey: "db_password"
    userPasswordKey: "db_password"
primary:
  persistence:
    enabled: true
    size: 10Gi
  # Explicit resources override the chart's small default resourcesPreset, which got postgres OOMKilled
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnvVars:
    - name: POSTGRES_DATABASE
      value: "adsb"
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: adsb-db-credentials
          key: db_user
    - name: POSTGRESQL_AUTH_METHOD
      value: "md5"
