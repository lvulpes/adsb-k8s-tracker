apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adsb-api-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: infisical-backend
    kind: SecretStore
  target:
    name: adsb-api-secret
    template:
      engineVersion: v2
  data:
    - secretKey: config.json
      remoteRef:
        key: api_flights.json
---
# Registration based tracking lists: every Infisical key starting with tracking- becomes a file,
# the key name is used as the filter name. New lists only need a new key, no chart change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adsb-api-tracking
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: infisical-backend
    kind: SecretStore
  target:
    name: adsb-api-tracking
    template:
      engineVersion: v2
  dataFrom:
    - find:
        name:
          regexp: "^tracking-"
