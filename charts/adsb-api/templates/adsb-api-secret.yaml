apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adsb-api-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: infisical-backend
    kind: SecretStore
  target:
    name: adsb-api-secret
    template:
      engineVersion: v2
  data:
    - secretKey: config.json
      remoteRef:
        key: api_flights.json
