<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS-B OSINT Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #00ffcc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            background-color: #1e1e1e;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #2a2a2a;
            color: #00ffcc;
        }
        tr:hover {
            background-color: #333;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .btn-load-more {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            display: none; /* Hidden by default */
            margin: 0 auto 40px auto;
        }
        .btn-load-more:hover {
            background-color: #00ccaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ADS-B Dashboard</h1>
        
        <h2>OSINT Aircraft Data</h2>
        <table id="osint-table">
            <thead>
                <tr id="osint-headers">
                    <!-- Headers generated dynamically -->
                </tr>
            </thead>
            <tbody id="osint-body">
                <tr><td colspan="100%">Loading data...</td></tr>
            </tbody>
        </table>
        <button id="btn-osint" class="btn-load-more">Load More</button>

        <h2>Local Receiver Data</h2>
        <table id="local-table">
            <thead>
                <tr id="local-headers">
                     <!-- Headers generated dynamically -->
                </tr>
            </thead>
            <tbody id="local-body">
                <tr><td colspan="100%">Loading data...</td></tr>
            </tbody>
        </table>
        <button id="btn-local" class="btn-load-more">Load More</button>
    </div>

    <script>
        const DISPLAY_LIMIT = 10;
        
        // State management for pagination
        const state = {
            osint: { data: [], currentIndex: 0 },
            local: { data: [], currentIndex: 0 }
        };

        function renderHeaders(data, headerId) {
            if (!data || data.length === 0) return;
            const thead = document.getElementById(headerId);
            thead.innerHTML = '';
            const columns = Object.keys(data[0]);
            columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col.toUpperCase();
                thead.appendChild(th);
            });
        }

        function renderRows(type) {
            const tbody = document.getElementById(`${type}-body`);
            const btn = document.getElementById(`btn-${type}`);
            const dataset = state[type].data;
            let index = state[type].currentIndex;

            // Clear loading text on first run
            if (index === 0) tbody.innerHTML = ''; 

            if (dataset.length === 0) {
                tbody.innerHTML = '<tr><td colspan="100%">No records found.</td></tr>';
                return;
            }

            // Slice the next chunk of data
            const chunk = dataset.slice(index, index + DISPLAY_LIMIT);
            chunk.forEach(row => {
                const tr = document.createElement('tr');
                Object.values(row).forEach(val => {
                    const td = document.createElement('td');
                    td.textContent = val !== null ? val : 'N/A';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            // Update current index
            state[type].currentIndex += chunk.length;

            // Toggle button visibility
            if (state[type].currentIndex < dataset.length) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        function initTable(type, data) {
            state[type].data = data;
            state[type].currentIndex = 0;
            
            renderHeaders(data, `${type}-headers`);
            renderRows(type);
            
            // Attach event listener to the load more button
            document.getElementById(`btn-${type}`).onclick = () => renderRows(type);
        }

        // Fetch OSINT Data
        fetch('/api/osint')
            .then(res => res.json())
            .then(json => initTable('osint', json.data))
            .catch(err => console.error('Error fetching OSINT:', err));

        // Fetch Local Data
        fetch('/api/local')
            .then(res => res.json())
            .then(json => initTable('local', json.data))
            .catch(err => console.error('Error fetching Local:', err));
    </script>
</body>
</html>
